# _test-v2/game.yaml
# Test fixture for the V2 Schema Engine.
# This is NOT a real game — it exists solely to exercise the schema and loader.
# It covers: state_model (globals + per_player), phases (timed + input_gate),
# turn_model (simultaneous), scoring, victory.

schema_version: "2.0"

manifest:
  id: test-v2-fixture
  name: Test V2 Fixture
  description: Minimal V2 game package used as a schema validation test fixture.
  version: "1.0.0"
  author: Boredless
  tags: [test, fixture]
  players:
    min: 2
    max: 6
  estimated_minutes:
    min: 5
    max: 10
  icon: flask
  accent_color: emerald
  categories: [test]

state_model:
  globals:
    round:
      type: integer
      default: 0
      visibility: public
    total_rounds:
      type: integer
      default: 3
      visibility: public
    current_question:
      type: string
      default: null
      visibility: public
  per_player:
    score:
      type: integer
      default: 0
      visibility: public
    answer:
      type: string
      default: null
      visibility: private

turn_model:
  type: simultaneous

phases:
  instructions:
    type: timed
    duration: 8
    screen:
      display: template:instructions
      phone: template:instructions
    on_exit:
      - action: advance
        to: play

  play:
    type: input_gate
    duration: 30
    input:
      primitive: text_submit
      target: per_player.answer
      required: all_players
    screen:
      display: template:waiting
      phone: template:text_input
    on_enter:
      - action: increment
        target: globals.round
    on_complete:
      - action: advance
        to: results

  results:
    type: timed
    duration: 10
    screen:
      display: template:results
      phone: template:results
    on_enter:
      - action: score_round
        formulas:
          correct_answer: 100
    on_exit:
      - action: conditional
        condition: "globals.round < globals.total_rounds"
        then:
          advance_to: play
        else:
          advance_to: final_results

  final_results:
    type: timed
    duration: 15
    screen:
      display: template:final_results
      phone: template:final_results

presentation:
  theme:
    colors:
      primary: "#10b981"
      secondary: "#059669"
      accent: "#f59e0b"
      background: "#0f1a17"
      surface: "#1a2e27"
      text: "#f8fafc"
    darkMode: true
    borderRadius: "8px"
  screens:
    - id: instructions
      template: info
      surface: both
      title: "How to Play"
      animations:
        enter: fade
        duration: 300
    - id: play
      template: prompt
      surface: both
      animations:
        enter: slide-up
        duration: 200
    - id: results
      template: reveal
      surface: both
    - id: final_results
      template: results
      surface: both

scoring:
  correct_answer: 100
  first_correct: 50

victory:
  type: highest_score
  after: all_rounds
  tiebreak: most_correct_guesses

events:
  - id: increment_round
    name: "Increment round on play entry"
    triggers:
      - type: phase_enter
        phase: play
    effects:
      - type: increment
        target: globals.round
        amount: 1

  - id: final_round_alert
    name: "Alert on final round"
    triggers:
      - type: state_change
        field: globals.round
        condition: "globals.round == globals.total_rounds"
    effects:
      - type: announce
        message: "Final round!"

  - id: game_start_sound
    name: "Play sound on game start"
    once: true
    triggers:
      - type: game_start
    effects:
      - type: play_sound
        sound: "game_start_chime"
